<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCYF Letter Studio</title>
<style>
:root{--bg:#fafaf9;--sf:#fff;--ink:#151515;--mut:#80807c;--ln:#e9e7e4;--acc:#1a8fcf;--sh:0 1px 2px rgba(0,0,0,.05),0 18px 40px -18px rgba(0,0,0,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0e;--sf:#161617;--ink:#f3f2ef;--mut:#8b8b88;--ln:#262628;--sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 BR,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{font:500 15px BM;letter-spacing:.02em;display:flex;align-items:center;gap:10px}.brand i{width:8px;height:8px;border-radius:50%;background:var(--acc)}.brand span{color:var(--mut);font-family:BR}#stat{color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:48px;max-width:1280px;margin:0 auto;padding:36px 32px 80px}
aside{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:26px;max-height:calc(100vh - 110px);overflow:auto;padding:2px 4px 2px 2px}
h2{margin:0 0 10px;font:500 11px BM;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 5px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
::placeholder{color:color-mix(in srgb,var(--mut) 70%,transparent)}
.st{display:flex;border:1px solid var(--ln);border-radius:10px;background:var(--sf);overflow:hidden}
.st button{width:44px;border:0;background:none;color:var(--ink);font-size:18px;cursor:pointer}.st button:hover{background:var(--bg)}
.st input{border:0;border-radius:0;text-align:center;box-shadow:none!important;font:500 16px BM}
.fld{margin-bottom:12px}.hint{font-size:12px;color:var(--mut);margin:8px 0}
details{border:1px solid var(--ln);border-radius:10px;background:var(--sf)}summary{padding:10px 12px;cursor:pointer;font-size:14px;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--mut)}details[open] summary::after{content:"–"}details>div{padding:0 12px 12px}textarea{min-height:130px;resize:vertical;font-size:13px}
.btn{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:500 14px BM;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.86}.btn.g{background:transparent;color:var(--ink);border-color:var(--ln)}.btn.g:hover{border-color:var(--ink);opacity:1}.btn:disabled{opacity:.45;cursor:wait}
.bs{display:flex;flex-direction:column;gap:10px}#bar{height:2px;background:var(--ln);border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s}#bar b{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}#msg{font-size:12px;color:var(--mut);min-height:16px}
#list{display:flex;flex-direction:column;gap:48px;min-width:0}
.card{content-visibility:auto;contain-intrinsic-size:auto 800px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:500 12px BM;letter-spacing:.1em;color:var(--mut)}
.meta>span{display:flex;align-items:center;min-width:0}.meta .d{width:6px;height:6px;border-radius:50%;background:var(--ln);margin-right:8px;flex:none}.ok .d{background:#2fb36b}
.meta .nm{margin-left:10px;color:var(--ink);letter-spacing:0;font:500 13px BM;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:0;background:none;color:var(--mut);font:500 12px BM;letter-spacing:.04em;cursor:pointer;padding:4px 8px;border-radius:6px}.ib:hover{color:var(--ink);background:var(--ln)}
.pv{height:min(74vh,720px);overflow:auto;border-radius:8px;background:#e8e8e6;box-shadow:var(--sh);position:relative}
.pv .busy{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:13px}
.pvi section.dx,#print section.dx{background:#fff var(--pg) 0.4px 0/793px 1121.5px no-repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pvi section.dx{margin:0 auto 14px!important;box-shadow:0 1px 4px rgba(0,0,0,.18)}.pvi{padding-top:14px}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.f .w2{grid-column:span 2}
.add{align-self:center;border:1px dashed var(--ln);background:none;color:var(--mut);padding:14px 22px;border-radius:12px;cursor:pointer;font:500 14px BM}.add:hover{color:var(--ink);border-color:var(--ink)}
section.dx>header,section.dx>footer{display:none!important}#print{position:absolute;left:-99999px;top:0;width:794px}
@media print{@page{size:A4;margin:0}body.printing>:not(#print){display:none!important}body.printing{background:#fff}body.printing #print{position:static;width:auto}#print section.dx{margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}}
@media(max-width:940px){main{grid-template-columns:1fr;gap:32px;padding:24px 18px 60px}aside{position:static;max-height:none}header{padding:0 18px}.f{grid-template-columns:1fr}.f .w2{grid-column:auto}}
